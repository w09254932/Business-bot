services:
  - type: web
    name: business-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/business_bot.db
    disk:
      name: business-bot-data
      mountPath: /var/data
      sizeGB: 1
