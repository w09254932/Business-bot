<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:var(--tg-theme-bg-color,#111827);--tx:var(--tg-theme-text-color,#f8fafc);--hint:var(--tg-theme-hint-color,#9ca3af);--sf:var(--tg-theme-secondary-bg-color,#1f2937);--ac:var(--tg-theme-button-color,#6554c0);--at:var(--tg-theme-button-text-color,#fff);--line:var(--tg-theme-section-separator-color,#374151);--good:#16a36a;--bad:#e05268}
*{box-sizing:border-box}body{margin:0;padding:9px;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}.head,.fieldtop,.resulthead,.historytop,.rowtop,.rowmeta{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;font-size:16px}.sub,.hint,.status{color:var(--hint)}.sub{font-size:10px}.tag{font-size:10px;padding:4px 8px;border-radius:20px;background:var(--sf);color:var(--hint)}.modes,.fields,.scores,.actions,.pager{display:grid;gap:6px}.modes{grid-template-columns:repeat(3,1fr);margin:9px 0}.fields,.scores{grid-template-columns:1fr 1fr}.mode,.soft,.key,.primary{border:0;border-radius:9px;padding:9px 4px;font:inherit;font-weight:700;color:var(--tx);background:var(--sf)}button{cursor:pointer}.mode.active,.primary{background:var(--ac);color:var(--at)}.field,.result,.item{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:8px}.field{text-align:right;cursor:pointer}.field.selected{border:1.5px solid var(--ac)}.fieldtop,.hint,.score small{font-size:10px;color:var(--hint)}.number{font-size:21px;font-weight:850;direction:ltr;text-align:right;min-height:26px}.hint{margin-top:2px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.key{padding:7px 3px;min-height:34px;font-size:16px}.actions{grid-template-columns:1.25fr 1fr 38px}.primary,.soft{min-height:36px}.result{display:none;margin-top:8px}.result.show{display:block}.resulthead{font-weight:800;margin-bottom:7px}.win{color:var(--good)}.loss,.error{color:var(--bad)}.score{background:var(--bg);border-radius:8px;padding:7px;text-align:center}.score small{display:block}.score strong{font-size:20px;display:block}.detail{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:6px 0;font-size:11px;gap:8px}.view{display:none}.view.show{display:block}.historytop{margin:5px 0 8px}.list{display:grid;gap:5px}.item{padding:7px}.rowtop{font-size:11px;font-weight:750}.rowmeta{font-size:10px;color:var(--hint);margin-top:4px}.pager{grid-template-columns:1fr auto 1fr;margin-top:7px;align-items:center}.empty{text-align:center;color:var(--hint);padding:14px 4px;font-size:12px}.status{font-size:10px;text-align:center;margin-top:6px}.status.error{color:var(--bad)}.small{padding:6px 3px}
</style></head><body>
<div class="head"><div><div class="brand">⚔️ TR BATTLE</div><div class="sub">حاسبة معركة الشعبية</div></div><div class="tag" id="modeLabel">الفردية</div></div>
<section id="calcView" class="view show">
 <div class="modes"><button class="mode active" id="modeIndividual">⚔️ الفردية</button><button class="mode" id="modeHome">🏠 المنزل</button><button class="mode" id="modeTeam">👥 الفريق</button></div>
 <div class="fields"><button class="field selected" id="mineField"><div class="fieldtop"><span id="mineLabel">شعبيتك</span><span>أنت</span></div><div class="number" id="mineValue">0</div><div class="hint">القيمة الأولى</div></button><button class="field" id="oppField"><div class="fieldtop"><span id="oppLabel">شعبية الخصم</span><span>الخصم</span></div><div class="number" id="oppValue">0</div><div class="hint">القيمة الثانية</div></button></div>
 <div class="keypad" id="keypad"><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key" id="clear">مسح</button><button class="key" data-digit="0">0</button><button class="key" id="backspace">⌫</button></div>
 <div class="actions"><button class="primary" id="calculate">احسب المعركة ⚔️</button><button class="soft" id="history">📜 سجلي</button><button class="soft small" id="reset" title="تصفير">↻</button></div>
 <div class="result" id="result"><div class="resulthead"><span>نتيجة المعركة</span><strong id="outcome"></strong></div><div class="scores"><div class="score"><small>نقاطك النهائية</small><strong id="myResult">—</strong></div><div class="score"><small>نقاط الخصم النهائية</small><strong id="oppResult">—</strong></div></div><div class="detail"><span>نقاط شريحتك</span><b id="myBase">—</b></div><div class="detail"><span>نقاط شريحة الخصم</span><b id="oppBase">—</b></div><div class="footer" id="savedText"></div></div>
</section>
<section id="historyView" class="view"><div class="historytop"><b>📜 سجل معاركك</b><button class="soft small" id="backCalc">↩ الحاسبة</button></div><div class="list" id="historyList"><div class="empty">اضغط تحديث لعرض سجل معاركك</div></div><div class="pager"><button class="soft small" id="prevPage">السابق</button><span class="tag" id="pageLabel">1</span><button class="soft small" id="nextPage">التالي</button></div><div class="footer">السجل محفوظ في حسابك على Firestore</div></section>
<div class="status" id="status">اختر نوع المعركة ثم أدخل الرقمين</div>
<script>
(function(){
'use strict';
const TW=typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
const state={mode:'individual',active:'mine',mine:'',opp:'',page:0,busy:false};
const $=id=>document.getElementById(id);
const labels={individual:'الفردية',home:'المنزل',team:'الفريق'};
const fmt=n=>Number(n||0).toLocaleString('en-US');
function status(text,isError){$('status').textContent=text;$('status').className='status'+(isError?' error':'')}
function render(){
 $('mineValue').textContent=state.mine?fmt(state.mine):'0';$('oppValue').textContent=state.opp?fmt(state.opp):'0';
 $('mineField').className='field'+(state.active==='mine'?' selected':'');$('oppField').className='field'+(state.active==='opp'?' selected':'');
 $('modeLabel').textContent=labels[state.mode];$('mineLabel').textContent=state.mode==='team'?'شعبية تيمك':'شعبيتك';$('oppLabel').textContent=state.mode==='team'?'شعبية تيم الخصم':'شعبية الخصم';
 ['Individual','Home','Team'].forEach(k=>{$('mode'+k).className='mode'+(state.mode===k.toLowerCase()?' active':'')});
}
function callBot(data){if(!TW||typeof TW.request!=='function')return Promise.reject(new Error('افتح الحاسبة من داخل تيليجرام لإجراء الحساب الفعلي'));return TW.request(data)}
function decodeAnswer(answer){if(!answer||typeof answer.result!=='string')throw new Error('لم يصل رد من البوت');let result;try{result=JSON.parse(answer.result)}catch(e){throw new Error('تعذّر قراءة رد الحاسبة')}if(!result.ok)throw new Error(result.message||'تعذّر تنفيذ الطلب');return result}
function busy(value){state.busy=value;$('calculate').disabled=value;$('history').disabled=value;$('calculate').textContent=value?'جاري التنفيذ…':'احسب المعركة ⚔️'}
function calculate(){
 if(state.busy)return;if(!state.mine||!state.opp){status('أدخل شعبيتك وشعبية الخصم أولاً',true);return}
 if(state.mine.length>15||state.opp.length>15){status('الحد الأقصى 15 خانة لكل رقم',true);return}
 busy(true);$('result').className='result';status('يتم حساب المعركة وحفظها…');
 callBot('calc|'+state.mode+'|'+state.mine+'|'+state.opp).then(decodeAnswer).then(r=>{
  $('result').className='result show';$('outcome').textContent=r.result;$('outcome').className=String(r.result).indexOf('فوز')>=0?'win':'loss';$('myResult').textContent=r.my_result;$('oppResult').textContent=r.opp_result;$('myBase').textContent=r.my_points+' نقطة';$('oppBase').textContent=r.opp_points+' نقطة';$('savedText').textContent=r.saved?'✓ تمت إضافة المعركة إلى سجلك':'تم الحساب؛ لم يتم تأكيد حفظ السجل';status('اكتمل الحساب');
 }).catch(e=>status(e.code==='RATE_LIMITED'?'طلبات كثيرة؛ انتظر قليلًا ثم حاول مجددًا':(e.message||e.code||'تعذّر الاتصال بالبوت'),true)).finally(()=>busy(false));
}
function addDigit(d){if(state.busy)return;const key=state.active;if(state[key].length>=15)return;state[key]=(state[key]+d).replace(/^0+(?=\d)/,'');render()}
function escapeHTML(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadHistory(page){
 if(state.busy)return;state.page=Math.max(0,page);$('calcView').className='view';$('historyView').className='view show';$('historyList').innerHTML='<div class="empty">جاري تحميل السجل…</div>';busy(true);status('يتم جلب السجل…');
 callBot('history|all|'+state.page).then(decodeAnswer).then(r=>{
  const rows=r.rows||[];if(!rows.length){$('historyList').innerHTML='<div class="empty">لا توجد معارك محفوظة في هذا السجل.</div>'}
  else{$('historyList').innerHTML=rows.map(x=>'<article class="item"><div class="rowtop"><span>'+escapeHTML(labels[x.mode]||'معركة')+' · '+escapeHTML(x.result)+'</span><span>'+escapeHTML(x.points)+' نقطة</span></div><div class="rowmeta"><span>'+fmt(x.mine)+' ضد '+fmt(x.opponent)+'</span><span>'+escapeHTML(x.date)+'</span></div></article>').join('')}
  $('pageLabel').textContent=String(state.page+1);$('prevPage').disabled=state.page===0;$('nextPage').disabled=!r.has_more;status('تم تحديث السجل');
 }).catch(e=>{$('historyList').innerHTML='<div class="empty error">'+escapeHTML(e.message||'تعذّر جلب السجل')+'</div>';status(e.message||e.code||'تعذّر جلب السجل',true)}).finally(()=>busy(false));
}
 document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>addDigit(b.getAttribute('data-digit'))));
 $('mineField').addEventListener('click',()=>{state.active='mine';render()});$('oppField').addEventListener('click',()=>{state.active='opp';render()});
 $('modeIndividual').addEventListener('click',()=>{state.mode='individual';$('result').className='result';render()});$('modeHome').addEventListener('click',()=>{state.mode='home';$('result').className='result';render()});$('modeTeam').addEventListener('click',()=>{state.mode='team';$('result').className='result';render()});
 $('clear').addEventListener('click',()=>{state[state.active]='';$('result').className='result';render()});$('backspace').addEventListener('click',()=>{state[state.active]=state[state.active].slice(0,-1);$('result').className='result';render()});$('reset').addEventListener('click',()=>{state.mine='';state.opp='';$('result').className='result';render();status('تم تصفير الحاسبة')});
 $('calculate').addEventListener('click',calculate);$('history').addEventListener('click',()=>loadHistory(0));$('backCalc').addEventListener('click',()=>{$('historyView').className='view';$('calcView').className='view show';status('اختر نوع المعركة ثم أدخل الرقمين')});
 $('prevPage').addEventListener('click',()=>{if(state.page>0)loadHistory(state.page-1)});$('nextPage').addEventListener('click',()=>loadHistory(state.page+1));
 render();if(TW&&typeof TW.ready==='function')TW.ready();
})();
</script></body></html>
