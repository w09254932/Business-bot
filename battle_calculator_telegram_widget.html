<div id="bc" dir="rtl"><style>
#bc{font:14px system-ui;color:var(--tg-theme-text-color,#fff);background:#100e1b;padding:12px;border-radius:15px}#bc *{box-sizing:border-box}#bc .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}#bc .brand{font-size:16px;font-weight:900}#bc .tag{font-size:10px;color:#bfa9ff;background:#30234c;padding:5px 8px;border-radius:20px}#bc .tabs,#bc .modes{display:grid;gap:5px;margin:8px 0}#bc .tabs{grid-template-columns:repeat(3,1fr)}#bc .modes{grid-template-columns:repeat(3,1fr)}#bc button{font:inherit;border:1px solid #39314e;border-radius:10px;background:#211c32;color:#eee;padding:9px 4px;font-weight:700}#bc button.on{background:linear-gradient(120deg,#794bdd,#346fbc);border-color:transparent;color:white}#bc .lbl{font-size:11px;color:#b6adc9;margin:10px 0 7px}#bc .fields{display:grid;grid-template-columns:1fr 1fr;gap:7px}#bc .field{background:#1b1728;padding:10px;border:1px solid #38304b;border-radius:12px;text-align:right;min-width:0}#bc .field.on{border-color:#a27aff}#bc .num{font-size:22px;font-weight:900;direction:ltr;text-align:right}#bc .pts{font-size:10px;color:#c1a9ff;margin-top:3px}#bc .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}#bc .keys button{padding:9px;font-size:17px}#bc .keys .sm{font-size:12px;color:#cfbaff}#bc .go{width:100%;margin-top:10px;background:linear-gradient(100deg,#8954ed,#367fce);border:0;color:white;padding:12px}#bc .out{margin-top:10px;padding:12px;background:#1d1830;border:1px solid #51406d;border-radius:12px}#bc .win{color:#55e0ab}#bc .loss{color:#ff7892}#bc .big{font-size:25px;font-weight:900;text-align:center;margin:5px}#bc .scores{display:grid;grid-template-columns:1fr 1fr;gap:7px}#bc .score{text-align:center;background:#12101d;border:1px solid #373047;border-radius:10px;padding:9px}#bc .score b{display:block;font-size:23px}#bc small{color:#b6adc9;font-size:10px}#bc .row{display:flex;justify-content:space-between;border-top:1px solid #3b334d;padding:7px 0;font-size:11px}#bc .rev{background:#191526;border:1px solid #38304b;border-radius:10px;padding:9px;margin-top:7px;font-size:11px;line-height:1.8}#bc .hist{background:#191526;border:1px solid #38304b;border-radius:10px;padding:9px;margin-top:7px;font-size:11px;line-height:1.8}#bc .muted{color:#aaa1bd;font-size:10px;text-align:center;margin-top:8px}#bc .hide{display:none}
</style>
<div class="hd"><span class="brand">⚔️ معركة الشعبية</span><span class="tag">حاسبة ذكية</span></div>
<div class="tabs"><button class="on" data-page="calc">⚔️ الحسبة</button><button data-page="rev">🎯 كم تبي؟</button><button data-page="hist">📜 سجلي</button></div>
<div class="modes"><button class="on" data-mode="individual">⚔️ فردية</button><button data-mode="home">🏠 المنزل</button><button data-mode="team">👥 الفريق</button></div>
<section id="calc"><div class="lbl">حدد الخانة ثم أدخل الشعبية</div><div class="fields"><button class="field on" data-field="a"><small id="la">شعبيتك</small><div class="num" id="a">0</div><div class="pts" id="pa">6 نقاط أساسية</div></button><button class="field" data-field="b"><small id="lb">شعبية الخصم</small><div class="num" id="b">0</div><div class="pts" id="pb">6 نقاط أساسية</div></button></div><div class="keys" id="keypad"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="sm" data-k="c">مسح</button><button data-k="0">0</button><button class="sm" data-k="b">⌫</button></div><button class="go" id="go">احسب المعركة ←</button><div id="result"></div></section>
<section id="rev" class="hide"><div class="lbl">أدخل عدد النقاط المطلوبة</div><div class="field on"><div class="num" id="t">0</div><div class="pts">النقاط المستهدفة</div></div><div class="keys" id="rkeys"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="sm" data-k="c">مسح</button><button data-k="0">0</button><button class="sm" data-k="b">⌫</button></div><button class="go" id="rgo">اعرض الاحتمالات ←</button><div id="rr"></div></section>
<section id="hist" class="hide"><div class="lbl">آخر 3 معارك على هذا الجهاز</div><div id="hh"></div><button class="go" id="clear">مسح السجل</button></section><div class="muted" id="status">التعادل محسوب كخسارة · اختر نوع المعركة للبدء</div></div>
<script>
(()=>{let I=[[0,2000,6],[2001,4000,10],[4001,8000,14],[8001,15000,16],[15001,50000,20],[50001,120000,24],[120001,260000,28],[260001,500000,32],[500001,900000,36],[900001,2000000,40],[2000001,8000000,42],[8000001,1e99,44]],T=[[0,5000,6],[5001,12000,10],[12001,26000,14],[26001,48000,16],[48001,120000,20],[120001,200000,24],[200001,400000,28],[400001,560000,32],[560001,800000,34],[800001,1600000,36],[1600001,3200000,38],[3200001,6000000,40],[6000001,1e99,42]],$=id=>document.getElementById(id),F=n=>Number(n).toLocaleString('en-US'),P=(n,m)=>(m==='team'?T:I).find(x=>n>=x[0]&&n<=x[1])[2],R=n=>Number.isInteger(n)?n:n.toFixed(1);let m='individual',a='',b='',f='a',t='';function draw(){$('a').textContent=F(+a);$('b').textContent=F(+b);$('pa').textContent=P(+a,m)+' نقاط أساسية';$('pb').textContent=P(+b,m)+' نقاط أساسية';$('la').textContent=m==='team'?'شعبية تيمك':'شعبيتك';$('lb').textContent=m==='team'?'شعبية تيم الخصم':'شعبية الخصم';document.querySelectorAll('[data-field]').forEach(x=>x.classList.toggle('on',x.dataset.field===f))}document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{m=x.dataset.mode;document.querySelectorAll('[data-mode]').forEach(y=>y.classList.toggle('on',y===x));$('result').innerHTML='';draw()});document.querySelectorAll('[data-field]').forEach(x=>x.onclick=()=>{f=x.dataset.field;draw()});function keys(id,fn){$(id).querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>fn(x.dataset.k))}keys('keypad',k=>{let v=f==='a'?a:b;v=k==='c'?'':k==='b'?v.slice(0,-1):v.length<15?v+k:v;if(f==='a')a=v;else b=v;draw()});function calc(x,y){let p=P(x,m),q=P(y,m),w=x>y;return {mode:m,my:x,opp:y,my_points:p,opp_points:q,result:w?'فوز':'خسارة',my_result:w?p+q/2:p/2,opp_result:w?q/2:q+p/2}}function hist(){try{return JSON.parse(localStorage.getItem('bc-h')||'[]')}catch(e){return []}}function save(r){try{localStorage.setItem('bc-h',JSON.stringify([r,...hist()].slice(0,3)))}catch(e){}}function view(r){let w=r.result==='فوز';return `<div class="out"><div class="big ${w?'win':'loss'}">${w?'🏆 فوز ✅':'💔 خسارة ❌'}</div><div class="scores"><div class="score"><b>${R(r.my_result)}</b><small>نقاطك النهائية</small></div><div class="score"><b>${R(r.opp_result)}</b><small>نقاط الخصم</small></div></div><div class="row"><span>شعبيتك · نقاطها</span><b>${F(r.my)} · ${r.my_points}</b></div><div class="row"><span>شعبية الخصم · نقاطها</span><b>${F(r.opp)} · ${r.opp_points}</b></div><div class="muted">${w?'نقاطك كاملة + نصف نقاط الخصم':'نصف نقاطك فقط، والخصم يأخذ نقاطه كاملة + نصف نقاطك'}</div></div>`}$('go').onclick=()=>{if(a===''||b===''){$('status').textContent='أدخل الرقمين أولاً';return}let r=calc(+a,+b);save(r);$('result').innerHTML=view(r);$('status').textContent='تم الحساب';if(window.TelegramWidget&&TelegramWidget.request){TelegramWidget.request(`c|${m}|${a}|${b}`).then(z=>{if(z&&z.result){try{$('result').innerHTML=view(JSON.parse(z.result));$('status').textContent='تم تأكيد الحسبة من البوت'}catch(e){}}}).catch(e=>$('status').textContent='تعذر الاتصال: '+(e.code||'خطأ'))}};$('t').textContent='0';keys('rkeys',k=>{t=k==='c'?'':k==='b'?t.slice(0,-1):t.length<4?t+k:t;$('t').textContent=F(+t||0)});function rg(n){return F(n[0])+' – '+(n[1]>1e90?'∞':F(n[1]))}function rev(n){let z=m==='team'?T:I,w=[],l=[];z.forEach(x=>z.forEach(y=>{if(x[2]>=y[2]&&x[2]+y[2]/2===n)w.push([x,y])}));z.forEach(x=>{if(x[2]/2===n)l.push(x)});let h=w.map((x,i)=>`<div class="rev">${i+1}) دعمك: ${rg(x[0])} (${x[0][2]} نقطة)<br>الخصم: ${rg(x[1])} (${x[1][2]} نقطة)</div>`).join('')||'<div class="rev">لا توجد تركيبة بالفوز.</div>';h='<b>✅ بالفوز</b>'+h;h+='<div class="lbl">❌ بالخسارة</div>'+(l.map(x=>`<div class="rev">دعمك: ${rg(x)} (${x[2]} نقطة) · تأخذ نصف نقاطك</div>`).join('')||'<div class="rev">لا توجد تركيبة بالخسارة.</div>');return h}$('rgo').onclick=()=>{$('rr').innerHTML=+t>0?rev(+t):'<div class="rev">أدخل النقاط المطلوبة أولاً.</div>'};function page(p){['calc','rev','hist'].forEach(x=>$(x).classList.toggle('hide',x!==p));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===p));if(p==='hist')$('hh').innerHTML=hist().map(x=>`<div class="hist">${x.result} · ${F(x.my)} مقابل ${F(x.opp)}<br>نتيجتك: ${R(x.my_result)} · الخصم: ${R(x.opp_result)}</div>`).join('')||'<div class="muted">لا توجد معارك محفوظة.</div>'}document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>page(x.dataset.page));$('clear').onclick=()=>{localStorage.removeItem('bc-h');$('hh').innerHTML='<div class="muted">تم مسح السجل.</div>'};draw()})();
</script>
