<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:var(--tg-theme-bg-color,#111827);--tx:var(--tg-theme-text-color,#f8fafc);--hint:var(--tg-theme-hint-color,#9ca3af);--sf:var(--tg-theme-secondary-bg-color,#1f2937);--ac:var(--tg-theme-button-color,#6554c0);--at:var(--tg-theme-button-text-color,#fff);--ln:var(--tg-theme-section-separator-color,#374151)}*{box-sizing:border-box}body{margin:0;padding:9px;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}.head,.historytop,.resulthead,.rowtop,.rowmeta,.fieldtop{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:16px}.sub,.status,.footer,.points,.fieldtop,.score small,.rowmeta{color:var(--hint)}.sub{font-size:10px}.tag{font-size:10px;padding:4px 7px;border-radius:18px;background:var(--sf);color:var(--hint)}.modes,.fields,.scoregrid,.actions,.pager{display:grid;gap:6px}.modes{grid-template-columns:repeat(3,1fr);margin:8px 0}.fields,.scoregrid{grid-template-columns:1fr 1fr}.mode,.soft,.key,.primary{border:0;border-radius:9px;padding:9px 4px;font:inherit;font-weight:650;color:var(--tx);background:var(--sf)}button{cursor:pointer}.mode.active,.primary{background:var(--ac);color:var(--at)}.field,.result,.rowitem{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px}.field.selected{border:1.5px solid var(--ac)}.fieldtop,.points,.score small{font-size:10px}.number{font-size:20px;font-weight:800;direction:ltr;text-align:right;min-height:25px}.points{margin-top:2px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.key{padding:8px 3px;min-height:34px;font-size:16px}.actions{grid-template-columns:1.25fr 1fr 38px}.primary,.soft{min-height:36px}.result{display:none;margin-top:8px}.result.show{display:block}.resulthead{font-weight:800;margin-bottom:7px}.win{color:#16a34a}.loss,.error{color:#dc2626}.score{background:var(--bg);border-radius:8px;padding:6px;text-align:center}.score small{display:block}.score strong{font-size:20px;display:block}.saved{text-align:center;color:#16a34a;font-size:10px;margin-top:6px}.view{display:none}.view.show{display:block}.historytop{margin:5px 0}.historylist{display:grid;gap:5px}.rowitem{padding:7px}.rowtop{font-size:11px;font-weight:700}.rowmeta{font-size:10px;margin-top:4px}.pager{grid-template-columns:1fr 1fr 1fr;margin-top:7px}.empty{text-align:center;color:var(--hint);padding:15px 4px;font-size:12px}.status{font-size:10px;min-height:14px;text-align:center;margin-top:5px}.small{padding:6px 3px}</style></head><body>
<div class="head"><div><div class="brand">⚔️ TR BATTLE</div><div class="sub">حاسبة معركة الشعبية</div></div><div class="tag" id="modeLabel">الفردية</div></div>
<div id="calcView" class="view show">
 <div class="modes"><button class="mode active" id="modeIndividual">⚔️ الفردية</button><button class="mode" id="modeHome">🏠 المنزل</button><button class="mode" id="modeTeam">👥 الفريق</button></div>
 <div class="fields"><div class="field selected" id="mineField"><div class="fieldtop"><span>شعبيتك</span><span>أنت</span></div><div class="number" id="mineValue">0</div><div class="points" id="minePoints">النقاط الأساسية —</div></div><div class="field" id="oppField"><div class="fieldtop"><span>شعبية الخصم</span><span>الخصم</span></div><div class="number" id="oppValue">0</div><div class="points" id="oppPoints">النقاط الأساسية —</div></div></div>
 <div class="keypad" id="keypad"><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key" id="clear">مسح</button><button class="key" data-digit="0">0</button><button class="key" id="backspace">⌫</button></div>
 <div class="actions"><button class="primary" id="calculate">احسب المعركة ⚔️</button><button class="soft" id="history">📜 سجلي</button><button class="soft small" id="reset" title="تصفير">↻</button></div>
 <div class="result" id="result"><div class="resulthead"><span>نتيجة المعركة</span><strong id="outcome"></strong></div><div class="scoregrid"><div class="score"><small>نقاطك النهائية</small><strong id="myResult">—</strong></div><div class="score"><small>نقاط الخصم</small><strong id="oppResult">—</strong></div></div><div class="saved" id="savedText"></div></div>
 </div>
 <div id="historyView" class="view"><div class="historytop"><b>📜 سجل معاركك</b><button class="soft small" id="backCalc">↩ الحاسبة</button></div><div class="historylist" id="historyList"><div class="empty">اضغط تحديث لعرض سجل معاركك</div></div><div class="pager"><button class="soft small" id="prevPage">السابق</button><span class="tag" id="pageLabel" style="text-align:center">1</span><button class="soft small" id="nextPage">التالي</button></div></div>
 <div class="status" id="status">اختر نوع المعركة ثم أدخل الرقمين</div>
<script>window.TelegramWidget={ready(){},request(data){let p=data.split('|');if(p[0]==='calc'){let t=p[1]==='team'?[[0,5000,6],[5001,12000,10],[12001,26000,14],[26001,48000,16],[48001,120000,20],[120001,200000,24],[200001,400000,28],[400001,560000,32],[560001,800000,34],[800001,1600000,36],[1600001,3200000,38],[3200001,6000000,40],[6000001,Infinity,42]]:[[0,2000,6],[2001,4000,10],[4001,8000,14],[8001,15000,16],[15001,50000,20],[50001,120000,24],[120001,260000,28],[260001,500000,32],[500001,900000,36],[900001,2000000,40],[2000001,8000000,42],[8000001,Infinity,44]],a=+p[2],b=+p[3],pt=n=>t.find(x=>n>=x[0]&&n<=x[1])[2],ap=pt(a),bp=pt(b),w=a>b;return Promise.resolve({result:JSON.stringify({ok:true,kind:'result',mine:a,opponent:b,my_points:ap,opp_points:bp,result:w?'فوز ✅':'خسارة ❌',my_result:String(w?ap+bp/2:ap/2),opp_result:String(w?bp/2:bp+ap/2),saved:false})})}return Promise.resolve({result:JSON.stringify({ok:true,kind:'history',rows:[{mode:'الفردية',result:'فوز ✅',mine:25000,opponent:18000,points:'30',date:'معاينة'},{mode:'الفريق',result:'خسارة ❌',mine:9000,opponent:12000,points:'5',date:'معاينة'}],page:0,has_more:false})})}};</script><script>
(function(){
 const W=window.TelegramWidget;
 const state={mode:'individual',active:'mine',mine:'',opp:'',page:0,busy:false};
 const $=id=>document.getElementById(id);
 const fmt=n=>Number(n||0).toLocaleString('en-US');
 const tiers={individual:[[0,2000,6],[2001,4000,10],[4001,8000,14],[8001,15000,16],[15001,50000,20],[50001,120000,24],[120001,260000,28],[260001,500000,32],[500001,900000,36],[900001,2000000,40],[2000001,8000000,42],[8000001,Infinity,44]],team:[[0,5000,6],[5001,12000,10],[12001,26000,14],[26001,48000,16],[48001,120000,20],[120001,200000,24],[200001,400000,28],[400001,560000,32],[560001,800000,34],[800001,1600000,36],[1600001,3200000,38],[3200001,6000000,40],[6000001,Infinity,42]]};
 function base(n){const t=tiers[state.mode==='team'?'team':'individual'];for(const x of t)if(n>=x[0]&&n<=x[1])return x[2];return 0}
 function setStatus(s,err){$('status').textContent=s;$('status').className='status'+(err?' error':'')}
 function render(){ $('mineValue').textContent=state.mine?fmt(state.mine):'0';$('oppValue').textContent=state.opp?fmt(state.opp):'0';$('minePoints').textContent='النقاط الأساسية '+(state.mine?base(+state.mine):'—');$('oppPoints').textContent='النقاط الأساسية '+(state.opp?base(+state.opp):'—');$('mineField').className='field'+(state.active==='mine'?' selected':'');$('oppField').className='field'+(state.active==='opp'?' selected':'');$('modeLabel').textContent={individual:'الفردية',home:'المنزل',team:'الفريق'}[state.mode];['Individual','Home','Team'].forEach(k=>{$('mode'+k).className='mode'+(state.mode===k.toLowerCase()?' active':'')}); }
 function request(data){if(!W||typeof W.request!=='function')return Promise.reject(new Error('افتحها داخل Telegram لتجربة الحساب'));return W.request(data)}
 function showResult(r){$('result').className='result show';$('outcome').textContent=r.result;$('outcome').className=r.result.indexOf('فوز')>=0?'win':'loss';$('myResult').textContent=r.my_result;$('oppResult').textContent=r.opp_result;$('savedText').textContent=r.saved?'✓ تم حفظ المعركة في سجلك': 'لم يُحفظ السجل؛ تحقق من تفعيل Firestore';}
 function parseAnswer(answer){if(!answer||!answer.result)throw new Error('لم يصل رد من البوت');const r=JSON.parse(answer.result);if(!r.ok)throw new Error(r.message||'تعذّر تنفيذ الطلب');return r}
 function setBusy(b){state.busy=b;$('calculate').disabled=b;$('history').disabled=b;$('calculate').textContent=b?'جاري الحساب…':'احسب المعركة ⚔️'}
 function calculate(){if(state.busy)return;if(!state.mine||!state.opp){setStatus('أدخل شعبيتك وشعبية الخصم أولاً',true);return}if(+state.mine>999999999999999||+state.opp>999999999999999){setStatus('الحد الأقصى 15 رقمًا لكل قيمة',true);return}setBusy(true);setStatus('يتم حساب المعركة وحفظها…');request('calc|'+state.mode+'|'+state.mine+'|'+state.opp).then(parseAnswer).then(r=>{showResult(r);setStatus('اكتمل الحساب')}).catch(e=>setStatus(e.message||'تعذّر الاتصال بالبوت',true)).finally(()=>setBusy(false));}
 function addDigit(d){let k=state.active==='mine'?'mine':'opp';if(state[k].length>=15)return;state[k]=(state[k]+d).replace(/^0+(?=\d)/,'');render();}
 function openHistory(page){state.page=page||0;$('calcView').className='view';$('historyView').className='view show';$('historyList').innerHTML='<div class="empty">جاري تحميل السجل…</div>';request('history|all|'+state.page).then(parseAnswer).then(r=>{let html='';if(!r.rows||!r.rows.length)html='<div class="empty">لا توجد معارك محفوظة</div>';else r.rows.forEach(x=>{html+='<div class="rowitem"><div class="rowtop"><span>'+esc(x.mode)+' · '+esc(x.result)+'</span><span>'+fmt(x.points)+' نقطة</span></div><div class="rowmeta"><span>'+fmt(x.mine)+' ضد '+fmt(x.opponent)+'</span><span>'+esc(x.date)+'</span></div></div>'});$('historyList').innerHTML=html;$('pageLabel').textContent=String(state.page+1);$('prevPage').disabled=state.page===0;$('nextPage').disabled=!r.has_more;setStatus('السجل محفوظ في Firestore')}).catch(e=>{$('historyList').innerHTML='<div class="empty error">'+esc(e.message||'تعذّر جلب السجل')+'</div>';setStatus(e.message||'تعذّر جلب السجل',true)});}
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>addDigit(b.getAttribute('data-digit'))));
 $('mineField').addEventListener('click',()=>{state.active='mine';render()});$('oppField').addEventListener('click',()=>{state.active='opp';render()});
 $('modeIndividual').addEventListener('click',()=>{state.mode='individual';$('result').className='result';render()});$('modeHome').addEventListener('click',()=>{state.mode='home';$('result').className='result';render()});$('modeTeam').addEventListener('click',()=>{state.mode='team';$('result').className='result';render()});
 $('clear').addEventListener('click',()=>{state[state.active]='';render()});$('backspace').addEventListener('click',()=>{state[state.active]=state[state.active].slice(0,-1);render()});$('reset').addEventListener('click',()=>{state.mine='';state.opp='';$('result').className='result';render();setStatus('تم تصفير الحاسبة')});
 $('calculate').addEventListener('click',calculate);$('history').addEventListener('click',()=>openHistory(0));$('backCalc').addEventListener('click',()=>{$('historyView').className='view';$('calcView').className='view show';setStatus('اختر نوع المعركة ثم أدخل الرقمين')});
 $('prevPage').addEventListener('click',()=>{if(state.page>0)openHistory(state.page-1)});$('nextPage').addEventListener('click',()=>openHistory(state.page+1));
 render();if(W&&typeof W.ready==='function')W.ready();
})();
</script></body></html>
